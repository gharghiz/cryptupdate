version: "3.9"
services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://cryptosit:cryptosit123@db:5432/cryptositnews
      - REDIS_URL=redis://redis:6379/0
      - APP_SECRET=change-this-to-random-64-char-string
      - JWT_SECRET=change-this-to-random-64-char-string
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - BOT_TOKEN=${BOT_TOKEN:-}
      - CHANNEL_ID=${CHANNEL_ID:-}
      - ADMIN_KEY_HASH=${ADMIN_KEY_HASH:-}
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - DATABASE_URL=postgresql://cryptosit:cryptosit123@db:5432/cryptositnews
      - REDIS_URL=redis://redis:6379/0
      - APP_SECRET=change-this-to-random-64-char-string
      - JWT_SECRET=change-this-to-random-64-char-string
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - BOT_TOKEN=${BOT_TOKEN:-}
      - CHANNEL_ID=${CHANNEL_ID:-}
      - ADMIN_KEY_HASH=${ADMIN_KEY_HASH:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cryptosit
      POSTGRES_PASSWORD: cryptosit123
      POSTGRES_DB: cryptositnews
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptosit"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  pgdata:
