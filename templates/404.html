<!DOCTYPE html>
<html lang="en" data-theme="{{ theme or 'dark' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found - CryptositNews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e17;--surface:#111827;--surface2:#1a2332;--border:#1e293b;
  --text:#e2e8f0;--text-muted:#64748b;--text-dim:#475569;
  --cyan:#06b6d4;--cyan-dim:rgba(6,182,212,0.15);
  --emerald:#10b981;--emerald-dim:rgba(16,185,129,0.15);
  --danger:#ef4444;--danger-dim:rgba(239,68,68,0.15);
  --warning:#f59e0b;--warning-dim:rgba(245,158,11,0.15);
  --font:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
  --radius:12px;--radius-sm:8px;--shadow:0 4px 24px rgba(0,0,0,0.3);
  --transition:0.3s cubic-bezier(0.4,0,0.2,1);
}
[data-theme="light"]{
  --bg:#f1f5f9;--surface:#ffffff;--surface2:#f8fafc;--border:#e2e8f0;
  --text:#0f172a;--text-muted:#64748b;--text-dim:#94a3b8;
  --cyan-dim:rgba(6,182,212,0.1);--emerald-dim:rgba(16,185,129,0.1);
  --danger-dim:rgba(239,68,68,0.1);--warning-dim:rgba(245,158,11,0.1);
  --shadow:0 4px 24px rgba(0,0,0,0.08);
}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;overflow:hidden;position:relative}
a{color:var(--cyan);text-decoration:none;transition:color var(--transition)}
a:hover{color:#22d3ee}

/* Background effects */
.bg-glow{position:fixed;width:600px;height:600px;border-radius:50%;filter:blur(120px);opacity:0.07;pointer-events:none;z-index:0}
.bg-glow-1{top:-200px;left:-200px;background:var(--cyan)}
.bg-glow-2{bottom:-200px;right:-200px;background:var(--emerald)}
.bg-grid{position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:60px 60px;opacity:0.15;z-index:0}

/* Error container */
.error-container{text-align:center;position:relative;z-index:1;padding:2rem}

/* 404 number */
.error-code{font-size:12rem;font-weight:900;font-family:var(--mono);line-height:1;background:linear-gradient(135deg,var(--text) 0%,var(--cyan) 50%,var(--emerald) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;position:relative;animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}

/* Glitch effect on hover */
.error-code::after{content:'404';position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,var(--cyan) 0%,var(--text) 50%,var(--emerald) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;opacity:0;transition:opacity 0.3s ease}
.error-container:hover .error-code::after{opacity:0.3;animation:glitch 0.3s ease}
@keyframes glitch{
  0%{transform:translate(0)}
  20%{transform:translate(-3px,3px)}
  40%{transform:translate(-3px,-3px)}
  60%{transform:translate(3px,3px)}
  80%{transform:translate(3px,-3px)}
  100%{transform:translate(0)}
}

.error-title{font-size:1.8rem;font-weight:700;margin:1.5rem 0 0.75rem;color:var(--text)}
.error-message{font-size:1.05rem;color:var(--text-muted);max-width:420px;margin:0 auto 2.5rem;line-height:1.75}

/* Illustration line */
.error-line{width:80px;height:3px;background:linear-gradient(90deg,var(--cyan),var(--emerald));border-radius:2px;margin:0 auto 2rem}

/* Buttons */
.error-actions{display:flex;align-items:center;justify-content:center;gap:1rem;flex-wrap:wrap}
.btn-primary{display:inline-flex;align-items:center;gap:0.5rem;padding:0.75rem 1.75rem;background:var(--cyan);color:#000;font-family:var(--font);font-size:0.92rem;font-weight:600;border:none;border-radius:var(--radius-sm);cursor:pointer;transition:all var(--transition)}
.btn-primary:hover{background:#22d3ee;transform:translateY(-2px);box-shadow:0 8px 24px rgba(6,182,212,0.25);color:#000}
.btn-primary svg{width:18px;height:18px}
.btn-secondary{display:inline-flex;align-items:center;gap:0.5rem;padding:0.75rem 1.75rem;background:var(--surface);color:var(--text-muted);border:1px solid var(--border);font-family:var(--font);font-size:0.92rem;font-weight:500;border-radius:var(--radius-sm);cursor:pointer;transition:all var(--transition)}
.btn-secondary:hover{color:var(--text);border-color:var(--text-dim);transform:translateY(-2px)}
.btn-secondary svg{width:18px;height:18px}

/* Quick links */
.quick-links{margin-top:3rem;display:flex;align-items:center;justify-content:center;gap:2rem;flex-wrap:wrap}
.quick-link{display:flex;flex-direction:column;align-items:center;gap:0.4rem;color:var(--text-dim);font-size:0.82rem;transition:color var(--transition);cursor:pointer}
.quick-link:hover{color:var(--cyan)}
.quick-link svg{width:22px;height:22px}

/* Floating particles */
.particle{position:fixed;width:2px;height:2px;background:var(--cyan);border-radius:50%;opacity:0;pointer-events:none;z-index:0;animation:particleFloat linear infinite}
@keyframes particleFloat{
  0%{opacity:0;transform:translateY(100vh)}
  10%{opacity:0.6}
  90%{opacity:0.6}
  100%{opacity:0;transform:translateY(-20px)}
}

/* Responsive */
@media(max-width:768px){
  .error-code{font-size:7rem}
  .error-title{font-size:1.4rem}
  .error-message{font-size:0.92rem}
  .quick-links{gap:1.25rem}
}
@media(max-width:480px){
  .error-code{font-size:5rem}
  .error-actions{flex-direction:column}
}
</style>
</head>
<body>

<!-- Background -->
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>
<div class="bg-grid"></div>

<!-- Error -->
<div class="error-container">
  <div class="error-code">404</div>
  <div class="error-line"></div>
  <h1 class="error-title">Page Not Found</h1>
  <p class="error-message">The page you're looking for doesn't exist or has been moved. It might have been swallowed by a black hole in the blockchain.</p>

  <div class="error-actions">
    <a href="/" class="btn-primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Back to Home
    </a>
    <a href="/news" class="btn-secondary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/></svg>
      Browse News
    </a>
  </div>

  <div class="quick-links">
    <a href="/market" class="quick-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Markets
    </a>
    <a href="/telegram" class="quick-link">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
      Telegram
    </a>
    <a href="/about" class="quick-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      About
    </a>
  </div>
</div>

<script>
(function(){
  // Theme
  const savedTheme=localStorage.getItem('theme')||document.documentElement.dataset.theme||'dark';
  document.documentElement.dataset.theme=savedTheme;

  // Create floating particles
  function createParticles(){
    const count=15;
    for(let i=0;i<count;i++){
      const p=document.createElement('div');
      p.className='particle';
      p.style.left=Math.random()*100+'vw';
      p.style.animationDuration=(8+Math.random()*12)+'s';
      p.style.animationDelay=(Math.random()*10)+'s';
      p.style.width=(1+Math.random()*2)+'px';
      p.style.height=p.style.width;
      if(Math.random()>0.5)p.style.background='var(--emerald)';
      document.body.appendChild(p);
    }
  }

  // Check reduced motion preference
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    createParticles();
  }
})();
</script>
</body>
</html>
