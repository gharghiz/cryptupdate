<!DOCTYPE html>
<html lang="{{ lang or 'en' }}" data-theme="{{ theme or 'dark' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - CryptositNews</title>
    <meta name="theme-color" content="#050508">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{background:#050508;color:#c8cad0;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;min-height:100vh}
        [data-theme="light"] body{background:#f5f5f8}
        a{color:inherit;text-decoration:none}
        .err{text-align:center;padding:20px}
        .err-code{font-family:'Inter',monospace;font-size:120px;font-weight:900;background:linear-gradient(135deg,#2563eb,#00dc82);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
        [data-theme="light"] .err-code{background:linear-gradient(135deg,#1d4ed8,#059669);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .err-msg{font-size:16px;color:#8888a8;margin:16px 0 28px}
        .err-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 24px;border-radius:8px;background:#2563eb;color:#fff;font-size:13px;font-weight:600;transition:all .2s}
        .err-btn:hover{box-shadow:0 0 20px rgba(37,99,235,0.3)}
        [data-theme="light"] .err-btn{background:#1d4ed8}
    </style>
</head>
<body data-theme="{{ theme or 'dark' }}">
    <div class="err">
        <div class="err-code">404</div>
        <p class="err-msg">This page doesn't exist or has been moved.</p>
        <a href="/" class="err-btn">← Back Home</a>
    </div>
</body>
</html>
