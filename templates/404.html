<!DOCTYPE html>
<html lang="en" data-theme="{{ theme or 'dark' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - CryptositNews</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config={darkMode:['class','[data-theme="dark"]'],theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}
    </script>
    <style>
        :root{--bg:#080b12;--surface:#0f1420;--text:#e8ecf2;--text2:#8892a6;--border:rgba(255,255,255,0.06);}
        [data-theme="light"]{--bg:#f0f4f8;--surface:#ffffff;--text:#0f172a;--text2:#475569;--border:rgba(0,0,0,0.08);}
        body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative">
    <div class="text-center px-6">
        <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-blue-500/20 to-violet-500/20 flex items-center justify-center mx-auto mb-6">
            <svg class="w-10 h-10 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM13 10H7"/></svg>
        </div>
        <h1 class="text-7xl font-extrabold bg-gradient-to-r from-blue-500 to-violet-500 bg-clip-text text-transparent mb-3">404</h1>
        <p class="text-lg font-medium mb-2" style="color:var(--text2)">Page Not Found</p>
        <p class="text-sm mb-8" style="color:var(--text2)">The page you're looking for doesn't exist or has been moved.</p>
        <a href="/" class="inline-flex items-center gap-2 px-6 py-3 rounded-xl text-sm font-semibold text-white transition hover:shadow-lg hover:shadow-blue-500/20" style="background:linear-gradient(135deg,#3b82f6,#2563eb)">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            Back to Home
        </a>
    </div>
</body>
</html>
