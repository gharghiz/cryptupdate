<!DOCTYPE html>
<html lang="{{ lang or 'en' }}" data-theme="{{ theme or 'dark' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markets - CryptositNews</title>
    <meta name="theme-color" content="#050508">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        html{scroll-behavior:smooth}
        body{background:#050508;color:#c8cad0;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6}
        a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer;border:none;background:none}
        ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#1a1a2e;border-radius:3px}
        :root{--bg:#050508;--bg2:#0a0a12;--bg3:#10101c;--border:#1a1a2e;--border2:#252540;--text:#e4e4ec;--text2:#8888a8;--text3:#4a4a6a;--blue:#2563eb;--blue2:#3b82f6;--green:#00dc82;--red:#ef4444;--amber:#f59e0b;--mono:'JetBrains Mono',monospace}
        [data-theme="light"]{--bg:#f5f5f8;--bg2:#eeeef4;--bg3:#fff;--border:#dddde8;--border2:#ccccdd;--text:#0a0a1a;--text2:#555570;--text3:#9999aa;--blue:#1d4ed8;--blue2:#2563eb;--green:#059669}
        .wrap{max-width:1100px;margin:0 auto;padding:0 20px}
        .nav{position:sticky;top:0;z-index:100;height:56px;background:rgba(5,5,8,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
        [data-theme="light"] .nav{background:rgba(245,245,248,0.85)}
        .nav-inner{max-width:1240px;margin:0 auto;padding:0 20px;height:100%;display:flex;align-items:center;justify-content:space-between}
        .logo{display:flex;align-items:center;gap:8px}
        .logo-icon{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--blue),var(--green));display:flex;align-items:center;justify-content:center}
        .logo-txt{font-size:16px;font-weight:800;letter-spacing:-0.04em;color:var(--text)}
        .logo-txt em{font-style:normal;color:var(--blue2)}
        .nav-a{padding:6px 12px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--text2);transition:all .15s}
        .nav-a:hover{color:var(--text);background:var(--bg3)}
        .nav-btn{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .15s}
        .nav-btn:hover{background:var(--bg3);color:var(--text)}
        .nav-btn svg{width:17px;height:17px}
        .page-head{padding:40px 0 28px}
        .page-title{font-size:28px;font-weight:900;letter-spacing:-0.03em;color:var(--text)}

        /* Stats */
        .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:32px}
        @media(max-width:768px){.stats{grid-template-columns:repeat(2,1fr)}}
        .stat{background:var(--bg2);padding:20px}
        .stat-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px}
        .stat-val{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--text)}

        /* TradingView */
        .tv-wrap{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:32px;background:var(--bg2)}
        .tv-head{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
        .tv-head h3{font-size:13px;font-weight:700;color:var(--text)}

        /* Price Table */
        .ptable{border:1px solid var(--border);border-radius:12px;overflow:hidden}
        .ptable-head{padding:14px 20px;border-bottom:1px solid var(--border)}
        .ptable-head h3{font-size:13px;font-weight:700;color:var(--text)}
        .ptable-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;align-items:center;padding:12px 20px;border-bottom:1px solid var(--border);transition:background .1s}
        @media(max-width:640px){.ptable-row{grid-template-columns:1.5fr 1fr 1fr;font-size:12px}}
        .ptable-row:hover{background:var(--bg3)}
        .ptable-row:last-child{border-bottom:none}
        .coin-name{display:flex;align-items:center;gap:10px}
        .coin-icon{width:24px;height:24px;border-radius:50%;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--text3);flex-shrink:0}
        .coin-icon img{width:100%;height:100%;object-fit:cover}
        .coin-sym{font-size:13px;font-weight:700;color:var(--text)}
        .coin-full{font-size:11px;color:var(--text3)}
        .price{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text)}
        .change{font-family:var(--mono);font-size:12px;font-weight:600}
        .change.up{color:var(--green)}.change.dn{color:var(--red)}
        .mcap{font-family:var(--mono);font-size:12px;color:var(--text2)}

        .footer{border-top:1px solid var(--border);padding:24px 0;margin-top:48px}
        .footer-copy{font-size:11px;color:var(--text3);text-align:center}
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <a href="/" class="logo"><div class="logo-icon"><svg width="14" height="14" fill="none" stroke="#fff" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></div><span class="logo-txt">Crypto<em>sit</em>News</span></a>
            <div style="display:flex;gap:2px"><a href="/" class="nav-a">Home</a><a href="/news" class="nav-a">News</a></div>
            <div class="nav-right"><button onclick="toggleTheme()" class="nav-btn"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg></button></div>
        </div>
    </nav>

    <div class="wrap">
        <div class="page-head"><h1 class="page-title">Markets</h1></div>

        <div class="stats">
            <div class="stat"><div class="stat-label">Market Cap</div><div class="stat-val" id="s-mcap">—</div></div>
            <div class="stat"><div class="stat-label">24h Volume</div><div class="stat-val" id="s-vol">—</div></div>
            <div class="stat"><div class="stat-label">BTC Dominance</div><div class="stat-val" id="s-btc">—</div></div>
            <div class="stat"><div class="stat-label">Active Coins</div><div class="stat-val" id="s-active">—</div></div>
        </div>

        <div class="tv-wrap">
            <div class="tv-head"><span>📊</span><h3>Bitcoin Chart</h3></div>
            <div style="height:400px"><iframe src="https://s.tradingview.com/widgetembed/?frameElementId=tv&symbol=BINANCE:BTCUSDT&interval=60&theme=dark&style=1&locale=en&toolbar_bg=%23050508&enable_publishing=false&hide_top_toolbar=false&hide_side_toolbar=false&allow_symbol_change=true" style="width:100%;height:100%;border:none" allowfullscreen></iframe></div>
        </div>

        <div class="ptable">
            <div class="ptable-head"><h3>Top Cryptocurrencies</h3></div>
            <div id="price-table"></div>
        </div>
    </div>

    <footer class="footer"><div class="wrap"><span class="footer-copy">© 2025 CryptositNews</span></div></footer>

    <script>
    const fmt=n=>{n=parseFloat(n);return n>=1e12?(n/1e12).toFixed(2)+'T':n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':n.toFixed(2)};
    async function load(){try{const[g,p]=await Promise.all([fetch('/api/global'),fetch('/api/prices')]);const gd=await g.json(),pd=await p.json();const gD=gd.data||gd,pD=pd.data||pd;
    document.getElementById('s-mcap').textContent='$'+fmt(gD.total_market_cap_usd);
    document.getElementById('s-vol').textContent='$'+fmt(gD.total_volume_usd);
    document.getElementById('s-btc').textContent=(gD.btc_dominance||0).toFixed(1)+'%';
    document.getElementById('s-active').textContent=(gD.active_cryptocurrencies||0).toLocaleString();
    const pc=p=>p>=1?p.toLocaleString('en',{maximumFractionDigits:2}):p.toFixed(6);
    document.getElementById('price-table').innerHTML=pD.map(c=>`<div class="ptable-row"><div class="coin-name"><div class="coin-icon">${c.image?`<img src="${c.image}" alt="">`:(c.symbol||'').slice(0,2)}</div><div><div class="coin-sym">${c.symbol}</div><div class="coin-full">${c.name}</div></div></div><div class="price">$${pc(c.price)}</div><div class="change ${c.change_24h>=0?'up':'dn'}">${c.change_24h>=0?'+':''}${c.change_24h?.toFixed(2)}%</div><div class="mcap">$${fmt(c.market_cap)}</div></div>`).join('')}catch(e){}}
    document.addEventListener('DOMContentLoaded',load);
    function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;document.cookie=`theme=${t};path=/;max-age=31536000`;location.reload()}
    </script>
</body>
</html>
