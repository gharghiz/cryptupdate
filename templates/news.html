<!DOCTYPE html>
<html lang="{{ lang or 'en' }}" data-theme="{{ theme or 'dark' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All News - CryptositNews</title>
    <meta name="description" content="Browse all crypto news articles.">
    <meta name="theme-color" content="#050508">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        html{scroll-behavior:smooth}
        body{background:#050508;color:#c8cad0;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6}
        a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer;border:none;background:none}
        ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#1a1a2e;border-radius:3px}
        :root{--bg:#050508;--bg2:#0a0a12;--bg3:#10101c;--border:#1a1a2e;--border2:#252540;--text:#e4e4ec;--text2:#8888a8;--text3:#4a4a6a;--blue:#2563eb;--blue2:#3b82f6;--green:#00dc82;--red:#ef4444;--amber:#f59e0b;--purple:#8b5cf6;--mono:'JetBrains Mono',monospace}
        [data-theme="light"]{--bg:#f5f5f8;--bg2:#eeeef4;--bg3:#fff;--border:#dddde8;--border2:#ccccdd;--text:#0a0a1a;--text2:#555570;--text3:#9999aa;--blue:#1d4ed8;--blue2:#2563eb;--green:#059669}
        .wrap{max-width:860px;margin:0 auto;padding:0 20px}
        .nav{position:sticky;top:0;z-index:100;height:56px;background:rgba(5,5,8,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
        [data-theme="light"] .nav{background:rgba(245,245,248,0.85)}
        .nav-inner{max-width:1240px;margin:0 auto;padding:0 20px;height:100%;display:flex;align-items:center;justify-content:space-between}
        .logo{display:flex;align-items:center;gap:8px}
        .logo-icon{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--blue),var(--green));display:flex;align-items:center;justify-content:center}
        .logo-txt{font-size:16px;font-weight:800;letter-spacing:-0.04em;color:var(--text)}
        .logo-txt em{font-style:normal;color:var(--blue2)}
        .nav-right{display:flex;align-items:center;gap:4px}
        .nav-btn{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:all .15s}
        .nav-btn:hover{background:var(--bg3);color:var(--text)}
        .nav-btn svg{width:17px;height:17px}
        .nav-a{padding:6px 12px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--text2);transition:all .15s}
        .nav-a:hover{color:var(--text);background:var(--bg3)}
        .page-head{padding:40px 0 24px}
        .page-title{font-size:28px;font-weight:900;letter-spacing:-0.03em;color:var(--text)}
        .cats{display:flex;gap:6px;margin-top:20px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
        .cats::-webkit-scrollbar{display:none}
        .cat{padding:6px 14px;border-radius:6px;font-size:11.5px;font-weight:600;color:var(--text3);background:var(--bg2);border:1px solid transparent;transition:all .15s;white-space:nowrap}
        .cat:hover{color:var(--text2);border-color:var(--border)}
        .cat.on{color:#fff;background:var(--blue);border-color:var(--blue)}
        .n-list{padding-bottom:48px}
        .n-item{display:block;padding:20px 0;border-bottom:1px solid var(--border);transition:all .15s}
        .n-item:hover{padding-left:6px}
        .n-item-meta{display:flex;align-items:center;gap:6px;margin-bottom:8px}
        .n-item-cat{padding:2px 7px;border-radius:3px;font-size:9.5px;font-weight:700;text-transform:uppercase;color:var(--text3);background:var(--bg)}
        .n-item-time{font-size:10px;color:var(--text3);font-family:var(--mono)}
        .n-item h2{font-size:16px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:6px;transition:color .15s}
        .n-item:hover h2{color:var(--blue2)}
        .n-item p{font-size:13px;color:var(--text2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .n-item-src{font-size:11px;color:var(--text3);margin-top:8px}
        .load-more{width:100%;padding:14px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text2);font-size:13px;font-weight:600;transition:all .15s;margin-top:16px}
        .load-more:hover{border-color:var(--border2);color:var(--text);background:var(--bg3)}
        .sk{background:var(--bg3);border-radius:6px;animation:skP 1.5s ease-in-out infinite}
        @keyframes skP{0%,100%{opacity:1}50%{opacity:.4}}
        .footer{border-top:1px solid var(--border);padding:24px 0}
        .footer-copy{font-size:11px;color:var(--text3);text-align:center}
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <a href="/" class="logo"><div class="logo-icon"><svg width="14" height="14" fill="none" stroke="#fff" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></div><span class="logo-txt">Crypto<em>sit</em>News</span></a>
            <div style="display:flex;gap:2px"><a href="/" class="nav-a">Home</a><a href="/market" class="nav-a">Markets</a></div>
            <div class="nav-right"><button onclick="toggleTheme()" class="nav-btn"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg></button></div>
        </div>
    </nav>

    <div class="wrap">
        <div class="page-head">
            <h1 class="page-title">All News</h1>
            <div class="cats" id="cat-tabs">
                <button onclick="filter('all')" class="cat on" data-c="all">All</button>
                <button onclick="filter('important')" class="cat" data-c="important">⚡ Important</button>
                <button onclick="filter('market')" class="cat" data-c="market">Market</button>
                <button onclick="filter('regulation')" class="cat" data-c="regulation">Regulation</button>
                <button onclick="filter('defi')" class="cat" data-c="defi">DeFi</button>
                <button onclick="filter('security')" class="cat" data-c="security">Security</button>
                <button onclick="filter('ai_crypto')" class="cat" data-c="ai_crypto">AI</button>
            </div>
        </div>
        <div id="news-list" class="n-list">
            <div class="n-item"><div class="sk" style="height:16px;width:100px;margin-bottom:10px"></div><div class="sk" style="height:22px;width:90%;margin-bottom:8px"></div><div class="sk" style="height:14px;width:100%"></div></div>
            <div class="n-item"><div class="sk" style="height:16px;width:100px;margin-bottom:10px"></div><div class="sk" style="height:22px;width:80%;margin-bottom:8px"></div><div class="sk" style="height:14px;width:70%"></div></div>
            <div class="n-item"><div class="sk" style="height:16px;width:100px;margin-bottom:10px"></div><div class="sk" style="height:22px;width:85%;margin-bottom:8px"></div><div class="sk" style="height:14px;width:90%"></div></div>
        </div>
        <button onclick="loadMore()" id="load-more" class="load-more" style="display:none">Load More</button>
    </div>

    <footer class="footer"><div class="wrap"><span class="footer-copy">© 2025 CryptositNews</span></div></footer>

    <script>
    let offset=0,cat='all',loading=false,done=false;
    function filter(c){cat=c;offset=0;done=false;document.querySelectorAll('.cat').forEach(e=>e.classList.toggle('on',e.dataset.c===c));loadNews(true)}
    async function loadNews(reset){if(loading)return;loading=true;if(reset)offset=0;try{const p=new URLSearchParams({limit:20,offset});if(cat!=='all')p.set(cat==='important'?'important':'category',cat==='important'?'true':cat);const r=await fetch(`/api/news?${p}`);const d=await r.json();const a=d.data?.news||d.news||[];if(!a.length)done=true;else offset+=a.length;const el=document.getElementById('news-list');if(reset)el.innerHTML='';if(!a.length&&!el.children.length)el.innerHTML='<p style="text-align:center;padding:40px;color:var(--text3);font-size:13px">No news found.</p>';a.forEach(n=>{el.innerHTML+=`<a href="/article/${n.id}" class="n-item"><div class="n-item-meta"><span class="n-item-cat">${n.category||'market'}</span>${n.is_important?'<span style="color:var(--amber);font-size:10px">⚡</span>':''}<span class="n-item-time">${n.time_ago||''}</span></div><h2>${n.title}</h2><p>${n.ai_summary||n.summary||''}</p><div class="n-item-src">${n.source||''}</div></a>`});document.getElementById('load-more').style.display=done?'none':'block'}catch(e){}loading=false}
    function loadMore(){loadNews(false)}
    document.addEventListener('DOMContentLoaded',()=>loadNews(true));
    function toggleTheme(){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;document.cookie=`theme=${t};path=/;max-age=31536000`;location.reload()}
    </script>
</body>
</html>
