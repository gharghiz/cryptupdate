<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rare Spontaneity | أخبار الكريبتو والذكاء الاصطناعي</title>
    <!-- تضمين Tailwind CSS للتصميم العصري -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
        .price-ticker { animation: marquee 20s linear infinite; }
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-slate-900 text-gray-900 dark:text-white transition-colors duration-300">

    <!-- 1. شريط الأسعار العلوي (Ticker) -->
    <div class="bg-blue-600 text-white py-2 overflow-hidden whitespace-nowrap sticky top-0 z-50 shadow-md">
        <div id="ticker" class="price-ticker inline-block">
            جاري تحميل الأسعار... ⏳
        </div>
    </div>

    <!-- 2. الهيدر (Header) -->
    <header class="container mx-auto px-4 py-8">
        <div class="flex justify-between items-center bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-xl border border-gray-100 dark:border-slate-700">
            <div>
                <h1 class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-500 to-indigo-600">
                    Rare Spontaneity 🌐
                </h1>
                <p class="text-gray-500 dark:text-gray-400 mt-1">مركز أخبار الكريبتو وتحليلات الذكاء الاصطناعي</p>
            </div>
            <div class="hidden md:flex space-x-reverse space-x-4">
                <span class="bg-green-100 text-green-700 px-4 py-2 rounded-full text-sm font-bold">● مباشر</span>
                <button onclick="window.location.reload()" class="bg-blue-500 hover:bg-blue-600 text-white p-2 rounded-full transition">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 3. شبكة الأخبار (News Grid) -->
    <main class="container mx-auto px-4 pb-12">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            
            {% for item in news %}
            <article class="bg-white dark:bg-slate-800 rounded-3xl shadow-lg hover:shadow-2xl transition-all duration-300 overflow-hidden border border-gray-100 dark:border-slate-700 group">
                <div class="p-6">
                    <!-- المصدر والوقت -->
                    <div class="flex justify-between items-center mb-4 text-xs font-bold uppercase tracking-wider">
                        <span class="text-blue-500">{{ item[1] }}</span> <!-- Source -->
                        <span class="text-gray-400">{{ item[5].strftime('%Y-%m-%d') }}</span> <!-- Date -->
                    </div>

                    <!-- العنوان -->
                    <h2 class="text-xl font-bold mb-3 group-hover:text-blue-500 transition-colors">
                        <a href="{{ item[4] }}" target="_blank">{{ item[0] }}</a>
                    </h2>

                    <!-- تحليل الذكاء الاصطناعي -->
                    <div class="bg-blue-50 dark:bg-slate-700/50 p-4 rounded-2xl mb-4 border-r-4 border-blue-500">
                        <div class="flex items-center mb-2">
                            <i class="fas fa-robot text-blue-500 mr-2 ml-2"></i>
                            <span class="text-xs font-bold text-blue-700 dark:text-blue-300">ملخص الذكاء الاصطناعي:</span>
                        </div>
                        <p class="text-sm text-gray-600 dark:text-gray-300 leading-relaxed italic">
                            "{{ item[2] }}"
                        </p>
                    </div>

                    <!-- التفاعل -->
                    <div class="flex items-center justify-between mt-6">
                        <span class="px-3 py-1 rounded-full text-xs font-bold {{ 'bg-green-100 text-green-700' if item[3] == 'Positive' else 'bg-gray-100 text-gray-700' }}">
                            {{ item[3] }}
                        </span>
                        <a href="{{ item[4] }}" class="text-blue-500 font-bold text-sm hover:underline">
                            اقرأ المزيد <i class="fas fa-arrow-left mr-1"></i>
                        </a>
                    </div>
                </div>
            </article>
            {% endfor %}

        </div>
    </main>

    <!-- 4. جافاسكريبت لجلب الأسعار الحية -->
    <script>
        async function fetchPrices() {
            try {
                const response = await fetch('/api/prices');
                const data = await response.json();
                const ticker = document.getElementById('ticker');
                
                let tickerHtml = "";
                for (const [coin, val] of Object.entries(data)) {
                    const price = val.usd.toLocaleString();
                    const change = val.usd_24h_change.toFixed(2);
                    const color = change > 0 ? 'text-green-300' : 'text-red-300';
                    tickerHtml += `<span class="mx-8 font-mono"><b>${coin.toUpperCase()}:</b> $${price} <span class="${color}">(${change}%)</span></span>`;
                }
                ticker.innerHTML = tickerHtml + tickerHtml; // مضاعفة النص لضمان استمرار الحركة
            } catch (error) {
                console.error("خطأ في جلب الأسعار", error);
            }
        }
        fetchPrices();
        setInterval(fetchPrices, 60000); // تحديث كل دقيقة
    </script>
</body>
</html>
